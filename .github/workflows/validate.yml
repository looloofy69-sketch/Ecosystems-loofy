name: Repository validation

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry and Markdown links
        run: python scripts/validate_registry.py
      - name: Run ecosystem repository tests
        run: python -m unittest discover -s tests -v
      - name: Install decision-infrastructure module
        run: python -m pip install -e modules/decision-infrastructure
      - name: Install decision MCP adapter
        run: python -m pip install -e adapters/decision-mcp
      - name: Run decision MCP adapter tests
        run: python -m unittest discover -s adapters/decision-mcp/tests -v
      - name: Compile imported package
        run: python -m compileall -q modules/decision-infrastructure/delta_infra
      - name: Run decision-infrastructure tests
        run: python -m unittest discover -s modules/decision-infrastructure/tests -v
      - name: Smoke-test CLI entry points
        run: |
          python -m delta_infra.cli --list-capabilities
          python -m delta_infra.workflow_cli --help
          python -m delta_infra.portfolio_cli --help
      - name: Build package wheel
        run: python -m pip wheel modules/decision-infrastructure --no-deps -w /tmp/delta-infra-wheel

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosystem-decision-api"
version = "0.1.0"
description = "Authenticated HTTP bridge for bounded, read-only ecosystem decision capabilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
ecosystem-decision-api = "ecosystem_decision_api.server:main"

[tool.setuptools.packages.find]
where = ["src"]
